name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: route-verdict
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build route-verdict-mcp
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish route-verdict-mcp
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
